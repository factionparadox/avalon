# liveslak settings for Avalon's install stick. build/build-iso puts this beside liveslak's
# make_slackware_live.sh (which reads it first) and runs:
#   make_slackware_live.sh -d AVALON -l gb -R 3 -H avalon -X -t doc -s /tmp/slackrepo
#
# The stick: Slackware -current's series a ap d l n x xap, then Avalon's own packages (the local
# module "avalon", from out/packages). The live session exists only to install: on the first
# console, root is logged in by itself and avalon-install starts, in large type.
# avalon-install copies the system (everything but this live session's own module, 0099) to disk.

LIVE_HOSTNAME="avalon"
MEDIALABEL="AVALON"
BUILDER="Avalon"
LIVEUIDFN="Avalon Live"
SEQ_CUSTOM="tagfile:a,ap,d,l,n,x,xap local:avalon"

custom_config() {
  # Only the live session gets these (liveslak keeps them in module 0099, which avalon-install
  # leaves out): the installer, root logged in on the first console, the installer starting there.
  install -D -m0755 ${LIVE_TOOLDIR}/avalon-install ${LIVE_ROOTDIR}/usr/sbin/avalon-install

  # tty1: root, logged in by itself (the whole line replaced, whatever starts tty1 now: -current
  # uses /sbin/vtselect.sh, which runs agetty or KMSCON)
  sed -i 's|^c1:\([0-9]*\):respawn:.*|c1:\1:respawn:/sbin/agetty --autologin root --noclear 38400 tty1 linux|' \
    ${LIVE_ROOTDIR}/etc/inittab
  grep -q -- '--autologin root' ${LIVE_ROOTDIR}/etc/inittab || {
    echo "custom_config: Slackware's inittab has changed; tty1's autologin wasn't set" >&2; exit 1; }

  # ...and the installer starts there, once, in large type
  cat >> ${LIVE_ROOTDIR}/root/.bash_profile <<'EOT'
# Avalon's live stick: the installer starts by itself on the first console (once)
if [ "$(tty)" = /dev/tty1 ] && [ ! -e /tmp/.avalon-install-started ]; then
  touch /tmp/.avalon-install-started
  setfont latarcyrheb-sun32 2>/dev/null
  /usr/sbin/avalon-install
fi
EOT

  # if it's quit, how to start it again
  cat >> ${LIVE_ROOTDIR}/etc/issue <<'EOT'

  Avalon's install stick.  To start the installer again, log in as root (password: root)
  and type:  avalon-install

EOT
}
