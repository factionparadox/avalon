# Avalon: the Garden System, for Mango (copied to /etc/mango/config.conf when avalon-desktop installs).
# Copy to ~/.config/mango/config.conf to change it for yourself; reload with Super+Shift+R.
# Keys follow Avalon's keybind reference (avalon-keyhelp shows it: Super+/).

# ---------------------------------------------------------------- the screen
# The laptop's own panel at 175% (things drawn 1.75 times larger, still sharp). For 150%, use
# scale:1.5; for another display add a line of its own (wlr-randr lists their names).
monitor_rule=name:^eDP-,scale:1.75

# ---------------------------------------------------------------- the look
# Garden System: hard PlayStation-era edges, deep navy, cyan for focus, magenta for urgency
border_px=1
border_radius=0
no_radius_when_single=0
root_color=0x070b16ff
border_color=0x2a3c62ff
focus_color=0x5fd8f0ff
urgent_color=0xff3fa4ff
maximized_screen_color=0x8fe3c8ff
scratchpad_color=0x9a8cffff
global_color=0xc9a35aff
overlay_color=0x5bc85bff
drop_color=0x5fd8f055
split_color=0xff3fa4ff

# blur behind the Garden System's panels and kitty's translucent background
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=6
blur_params_noise=0.03
blur_params_brightness=0.85
blur_params_contrast=0.95
blur_params_saturation=1.15
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=14
shadows_blur=18
shadows_color=0x000000c0
focused_opacity=1.0
unfocused_opacity=0.96
# unfocused windows a little dimmed, so the focused one stands out like a selected target
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x0a0f1c40

# the Garden System's HUD panels draw their own glass: no blur behind them, no shadow
layer_rule=layer_name:garden-hud,no_blur:1,no_shadow:1
layer_rule=layer_name:garden-wallpaper,no_blur:1,no_shadow:1

# gaps
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=14
gap_outer_vertical=14
smart_gaps=0

# ------------------------------------------------------------- animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.6
animation_duration_move=260
animation_duration_open=240
animation_duration_tag=280
animation_duration_close=220
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# ------------------------------------------------------- the scroller layout
# windows are columns you scroll through; Super+R cycles a column through these widths
scroller_structs=20
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33,0.5,0.67,1.0
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
tag_num=9
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# the window overview (Super+Shift+Tab; Super+Tab is the Garden System star system)
overview_gap_inner=10
overview_gap_outer=40

# ------------------------------------------------------------ input
xkb_rules_layout=gb,ru
xkb_rules_variant=,phonetic
xkb_rules_options=grp:alt_shift_toggle
repeat_rate=30
repeat_delay=400
numlock_on=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
cursor_size=24
sloppy_focus=1
warp_cursor=0
focus_on_activate=1

# ------------------------------------------------- the Garden System, at start
exec_once=garden-session

# =============================================================== keys
# Workstations
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,Tab,spawn,garden starsystem
bind=SUPER+SHIFT,Tab,toggleoverview

# Applications
bind=SUPER,w,spawn,avalon-open web
bind=SUPER,t,spawn,kitty
bind=SUPER,d,spawn,avalon-open discord
bind=SUPER,v,spawn,avalon-open video
bind=SUPER,e,spawn,avalon-open files
bind=SUPER,space,spawn,garden launcher
bind=SUPER,a,spawn,avalon-open anime
bind=SUPER,p,spawn,avalon-open vpn
bind=SUPER,slash,spawn,garden keyhelp
bind=SUPER,n,spawn,garden neredy
bind=SUPER,semicolon,spawn,garden command
bind=SUPER,comma,spawn,avalon-control

# Windows
bind=SUPER,q,killclient,
bind=SUPER,f,set_proportion,1.0
bind=SUPER,r,switch_proportion_preset,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Session
bind=SUPER,x,spawn,garden lock
bind=SUPER,z,spawn,avalon power suspend
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,Escape,spawn,garden power

# Screenshots
bind=SUPER+SHIFT,s,spawn,sh -c 'grim -g "$(slurp)" - | swappy -f -'

# Keyboard and media (Alt+Shift switches layout: xkb_rules_options above)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# touchpad: three fingers scroll the columns, four switch workstations
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,right,4,viewprev_have_client
